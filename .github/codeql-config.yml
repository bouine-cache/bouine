name: "CodeQL Config"

# bouine is a reverse proxy cache. The go/request-forgery query flags
# every origin/peer fetch as SSRF because the request URL is user-
# controlled. This is the intended behavior of a reverse proxy, not a
# vulnerability. We use a custom query suite that excludes this query.
# Origin addresses are operator-configured, not user input.
queries:
  - uses: .github/codeql/bouine.qls
