name: "CodeQL Config"

# bouine is a reverse proxy cache. The go/request-forgery query (in the
# security-extended suite) flags every origin/peer fetch as SSRF because
# the request URL is user-controlled. This is the intended behavior of a
# reverse proxy, not a vulnerability. We use only security-and-quality
# which excludes go/request-forgery while keeping quality + maintainability
# queries. Origin addresses are operator-configured, not user input.
queries:
  - uses: security-and-quality
