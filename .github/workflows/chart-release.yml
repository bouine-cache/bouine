name: Chart Release

# Packages the Helm chart in deploy/helm/bouine and publishes it to a
# GitHub Pages Helm repository (https://charts.bouine.org), which
# Artifact Hub indexes. Runs automatically on every release tag so the
# chart version tracks the app release (Chart.yaml `version` must be bumped
# alongside `appVersion` before tagging — chart-releaser skips versions it
# has already published).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  release-chart:
    name: Package and publish chart
    runs-on: [self-hosted, ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.HELM_CHART_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.HELM_CHART_GPG_PASSPHRASE }}

      - name: Package and sign chart
        run: |
          set -euo pipefail
          mkdir -p .cr-release-packages
          # helm's --sign uses the Go openpgp library, which does not support
          # ed25519 keys. Package without --sign, then create the provenance
          # file manually with gpg --detach-sign.
          helm package deploy/helm/bouine \
            --destination .cr-release-packages
          chart="$(ls .cr-release-packages/*.tgz)"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.HELM_CHART_GPG_PASSPHRASE }}" \
            --local-user "${{ vars.HELM_CHART_GPG_KEY_ID }}" \
            --detach-sign --armor "$chart"
          # gpg produces .asc; rename to .prov so chart-releaser / Artifact Hub
          # recognises the provenance sidecar.
          mv "${chart}.asc" "${chart}.prov"
          # Verify both files exist
          ls -la .cr-release-packages/*.tgz .cr-release-packages/*.tgz.prov

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: deploy/helm
          # Use the pre-packaged .tgz from the previous step instead of
          # re-packaging, so the GPG-signed package is preserved.
          skip_packaging: true
          # Re-runs (and tags whose chart version is already published) must
          # not fail when the GitHub release already exists; cr still
          # refreshes index.yaml from the packaged charts.
          skip_existing: true
          # Host the packaged .tgz files on the gh-pages branch (served by
          # Pages at charts.bouine.org) instead of as GitHub release assets.
          # Release assets on a private repo are not anonymously downloadable,
          # which breaks `helm install` and Artifact Hub indexing.
          packages_with_index: true
          # The Helm-chart release (named `bouine-<version>`) must never claim
          # the repo "Latest" pointer — that belongs to the application release
          # (`v<version>`). Otherwise GitHub's releases/latest API briefly
          # resolves to the chart release, which carries no binaries, breaking
          # the docs install one-liner until the app release publishes.
          mark_as_latest: false
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish provenance files to gh-pages
        run: |
          set -euo pipefail
          # chart-releaser with --packages-with-index pushes .tgz files to
          # gh-pages, but does not reliably include .prov provenance files.
          # Copy them alongside the .tgz so Artifact Hub detects the chart
          # as signed (it looks for a .prov sidecar next to each .tgz).
          git fetch origin gh-pages
          tmp="$(mktemp -d)"
          git worktree add "$tmp" origin/gh-pages
          cp .cr-release-packages/*.tgz.prov "$tmp/" 2>/dev/null || true
          git -C "$tmp" add '*.tgz.prov'
          if ! git -C "$tmp" diff --cached --quiet; then
            git -C "$tmp" commit -m "ci: publish signed chart provenance files"
            git -C "$tmp" pull --rebase origin gh-pages || true
            git -C "$tmp" push origin HEAD:gh-pages
          fi
          git worktree remove "$tmp"

      - name: Publish Artifact Hub repository metadata
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          tmp="$(mktemp -d)"
          git worktree add "$tmp" origin/gh-pages
          cp deploy/helm/artifacthub-repo.yml "$tmp/artifacthub-repo.yml"
          git -C "$tmp" add artifacthub-repo.yml
          if ! git -C "$tmp" diff --cached --quiet; then
            git -C "$tmp" commit -m "ci: sync Artifact Hub repository metadata"
            git -C "$tmp" pull --rebase origin gh-pages || true
            git -C "$tmp" push origin HEAD:gh-pages
          fi
          git worktree remove "$tmp"
