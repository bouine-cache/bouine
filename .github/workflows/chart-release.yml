name: Chart Release

# Packages the Helm chart in deploy/helm/bouine and publishes it to a
# GitHub Pages Helm repository (https://charts.bouine.org), which
# Artifact Hub indexes. Runs automatically on every release tag so the
# chart version tracks the app release (Chart.yaml `version` must be bumped
# alongside `appVersion` before tagging — chart-releaser skips versions it
# has already published).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  release-chart:
    name: Package and publish chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: deploy/helm
          # Re-runs (and tags whose chart version is already published) must
          # not fail when the GitHub release already exists; cr still
          # refreshes index.yaml from the packaged charts.
          skip_existing: true
          # Host the packaged .tgz files on the gh-pages branch (served by
          # Pages at charts.bouine.org) instead of as GitHub release assets.
          # Release assets on a private repo are not anonymously downloadable,
          # which breaks `helm install` and Artifact Hub indexing.
          packages_with_index: true
          # The Helm-chart release (named `bouine-<version>`) must never claim
          # the repo "Latest" pointer — that belongs to the application release
          # (`v<version>`). Otherwise GitHub's releases/latest API briefly
          # resolves to the chart release, which carries no binaries, breaking
          # the docs install one-liner until the app release publishes.
          mark_as_latest: false
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Artifact Hub repository metadata
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          tmp="$(mktemp -d)"
          git worktree add "$tmp" origin/gh-pages
          cp deploy/helm/artifacthub-repo.yml "$tmp/artifacthub-repo.yml"
          git -C "$tmp" add artifacthub-repo.yml
          if ! git -C "$tmp" diff --cached --quiet; then
            git -C "$tmp" commit -m "ci: sync Artifact Hub repository metadata"
            git -C "$tmp" push origin HEAD:gh-pages
          fi
          git worktree remove "$tmp"
