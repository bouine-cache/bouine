name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"
  CGO_ENABLED: "1"

jobs:
  prek:
    name: prek
    runs-on: [self-hosted, ci]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: j178/prek-action@v3.0.0

  govulncheck:
    name: govulncheck
    runs-on: [self-hosted, ci]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  test-linux:
    name: test (ubuntu-latest)
    runs-on: [self-hosted, ci]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go test -race -count=1 -timeout=120s -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true

  test-arm:
    name: test (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go test -race -count=1 -timeout=120s ./...

  test-macos:
    name: test (macos-14)
    runs-on: macos-14
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go test -race -count=1 -timeout=120s ./...

  conformance:
    name: build + cache-tests conformance
    runs-on: [self-hosted, ci]
    needs: [prek, test-linux]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run cache-tests conformance suite
        run: make conformance
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: bouine-${{ github.sha }}
          path: bin/bouine
          if-no-files-found: error
          retention-days: 7
      - name: Check conformance score
        run: |
          RESULTS_FILE="test/cachetests/results/bouine.json"
          if [ ! -s "$RESULTS_FILE" ]; then
            echo "FAIL: results file is empty"
            exit 1
          fi
          PASS=$(node -e "
            const r = JSON.parse(require('fs').readFileSync('$RESULTS_FILE','utf8').trim());
            let pass = 0;
            for (const [, arr] of Object.entries(r)) {
              if (!Array.isArray(arr) || arr.length === 0) pass++;
            }
            console.log(pass);
          " 2>/dev/null || echo "0")
          echo "Conformance: $PASS tests passing"
          if [ "$PASS" -lt 339 ]; then
            echo "FAIL: conformance score $PASS is below baseline of 339"
            exit 1
          fi
          echo "PASS: conformance score $PASS >= 339"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-tests-results-${{ github.sha }}
          path: test/cachetests/results/
          if-no-files-found: ignore
          retention-days: 30

  bench:
    name: benchmark gate
    runs-on: [self-hosted, ci]
    needs: [prek, test-linux]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run benchmarks with alloc gates
        run: make bench-gate
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ github.sha }}
          path: bench/results/
          if-no-files-found: ignore
          retention-days: 30

  integration:
    name: integration + chaos
    runs-on: [self-hosted, ci]
    needs: [prek, test-linux]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run integration tests (strong + eventual)
        run: make integration
      - name: Run chaos tests
        run: make chaos
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-chaos-logs-${{ github.sha }}
          path: |
            test/integration/*.out
            test/chaos/*.out
          if-no-files-found: ignore
          retention-days: 7
