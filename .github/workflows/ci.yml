name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"
  CGO_ENABLED: "1"

jobs:
  prek:
    name: prek
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: j178/prek-action@v3.0.0

  # golangci-lint is already run by the prek job above (golangci-lint-full
  # hook in .pre-commit-config.yaml), so a separate lint job would be
  # redundant.
  # lint:
  #   name: golangci-lint
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #       with:
  #         fetch-depth: 0
  #     - uses: actions/setup-go@v7
  #       with:
  #         go-version: ${{ env.GO_VERSION }}
  #         cache: true
  #     - uses: golangci/golangci-lint-action@v9
  #       with:
  #         version: v2.12.2
  #         args: --timeout=5m

  govulncheck:
    name: govulncheck
    runs-on: [self-hosted, linux]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  test-linux:
    name: test (linux/amd64)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go test -race -count=1 -timeout=120s -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  test-macos:
    name: test (macos-14)
    runs-on: macos-14
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go test -race -count=1 -timeout=120s ./...

  conformance:
    name: build + cache-tests conformance
    runs-on: [self-hosted, linux]
    needs: [prek, test-linux]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: build
        run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: bouine-${{ github.sha }}
          path: bin/bouine
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run cache-tests conformance suite
        run: make conformance
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cache-tests-results-${{ github.sha }}
          path: test/cachetests/results/
          if-no-files-found: ignore
          retention-days: 30

  # bench:
