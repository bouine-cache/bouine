name: load-test-nightly

on:
  schedule:
    # 02:00 UTC every day — off-peak, avoids contention with CI
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenario group to run (single|cluster|dashboard|all)"
        required: false
        default: "single"

concurrency:
  group: loadtest-nightly
  cancel-in-progress: false   # never cancel a running load test mid-stream

# issues:write lets the regression-gate step open a tracking issue with
# the job's GITHUB_TOKEN — without this block the default token on
# self-hosted runners is read-only and that step fails with
# "Resource not accessible by integration" on top of the real failure.
permissions:
  contents: read
  issues: write

jobs:
  # -------------------------------------------------------------------------
  # §3.1–§3.6 single-node scenarios (Docker Compose, self-hosted runner)
  # -------------------------------------------------------------------------
  single-node:
    name: Single-node scenarios (§3.1–§3.6)
    runs-on: [self-hosted, load-test]
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.scenarios == 'single' ||
      github.event.inputs.scenarios == 'all'
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install k6
        run: |
          if ! command -v k6 &>/dev/null; then
            # The load-test runner container runs as uid 1001 (runner),
            # and /usr/local/bin is root-owned: the plain tar -C there
            # fails with "Permission denied" (nightly red since Aug 9).
            # sudo is available NOPASSWD in runner-dind; use it for the
            # /usr/local/bin install and keep the file runner-owned so
            # later steps can manage it.
            curl -fsSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz \
              | sudo tar -xz --strip-components=1 -C /usr/local/bin k6-v0.54.0-linux-amd64/k6
            sudo chown "$(id -u):$(id -g)" /usr/local/bin/k6
          fi
          k6 version

      - name: Install Python deps
        run: |
          # Ubuntu 24.04 (PEP 668) blocks system-wide pip installs and the
          # runner image ships python3 without pip — provision both, then
          # install to the user site so no sudo is needed for the deps.
          if ! python3 -m pip --version &>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-pip
          fi
          python3 -m pip install -q --user --break-system-packages plotly kaleido
          python3 -c "import plotly, kaleido; print('python deps OK')"

      - name: Build images
        run: make loadtest-setup

      - name: Run §3.1–§3.6
        # The Makefile's single-node entry point is `make loadtest`
        # (scenarios + charts + report in one target); the workflow
        # historically called a loadtest-single target that never
        # existed, so this step could not have passed even with a
        # healthy runner.
        run: make loadtest-scenarios

      - name: Generate charts + report
        run: make loadtest-report

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loadtest-single-${{ github.run_id }}
          path: bench/loadtest/results/
          retention-days: 30

      - name: Check regressions
        run: |
          python3 bench/loadtest/analysis/report.py \
            --results-dir bench/loadtest/results \
            --charts-dir  bench/loadtest/results/charts \
            --output      bench/loadtest/REPORT.md
          # Fail if bouine p99 > 10ms on hit-only scenario
          python3 - << 'EOF'
          import json, sys, pathlib, math

          def pct(data, p):
              if not data: return 0
              s = sorted(data)
              return s[max(0, int(math.ceil(p/100*len(s)))-1)]

          f = pathlib.Path("bench/loadtest/results/3.2_hit_only/bouine.json")
          if not f.exists():
              print("No hit-only results — skipping regression gate")
              sys.exit(0)

          durations = []
          with open(f) as fh:
              for line in fh:
                  line = line.strip()
                  if not line: continue
                  try:
                      r = json.loads(line)
                      if r.get("type") == "Point" and r.get("metric") == "http_req_duration":
                          durations.append(float(r["data"]["value"]))
                  except Exception:
                      pass

          p99 = pct(durations, 99)
          threshold = 10.0
          print(f"Hit-only p99 = {p99:.2f} ms  (threshold = {threshold} ms)")
          if p99 > threshold:
              print(f"REGRESSION: p99 {p99:.2f} ms exceeds {threshold} ms budget")
              sys.exit(1)
          EOF

      - name: Open issue on regression
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `⚠️ Load-test regression detected — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              '## Load-test nightly regression',
              '',
              `Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              'The `3.2_hit_only` bouine p99 exceeded the 10 ms budget.',
              'Download the artifacts from the run above for details.',
              '',
              '### Next steps',
              '1. Download `loadtest-single-*` artifact',
              '2. Run `make loadtest-report` locally with the result files',
              '3. Check `bench/loadtest/REPORT.md` for the failing scenario section',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body,
              labels: ['performance', 'regression', 'load-test'],
            });

  # -------------------------------------------------------------------------
  # §4.1–§4.5 cluster scenarios (Kubernetes, separate runner)
  # -------------------------------------------------------------------------
  cluster:
    name: Cluster scenarios (§4.1–§4.5)
    runs-on: [self-hosted, load-test-k8s]
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.scenarios == 'cluster' ||
      github.event.inputs.scenarios == 'all'
    timeout-minutes: 90
    needs: []   # runs concurrently with single-node

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install k6
        run: |
          if ! command -v k6 &>/dev/null; then
            # See the single-node job: the runner user cannot write
            # /usr/local/bin without sudo.
            curl -fsSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz \
              | sudo tar -xz --strip-components=1 -C /usr/local/bin k6-v0.54.0-linux-amd64/k6
            sudo chown "$(id -u):$(id -g)" /usr/local/bin/k6
          fi

      - name: Install make if missing
        run: |
          # Self-heal for the load-test-k8s runner image, which has
          # historically missed build tooling: install make here so the
          # nightly stays green until the image is rebuilt with it baked
          # in (then this step becomes a no-op and can be dropped).
          if ! command -v make &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends make
          fi

      - name: Check runner prerequisites
        run: |
          # The load-test-k8s runner image has historically missed
          # build tooling (make) — fail with a clear message at the top
          # instead of an opaque "make: command not found" in whatever
          # step needs it first.
          for tool in make docker kubectl; do
            if ! command -v "$tool" &>/dev/null; then
              echo "::error::The load-test-k8s runner image is missing '$tool'. Bake it into the image (or install it here) before running cluster scenarios."
              exit 1
            fi
          done

      - name: Build + push images
        env:
          KO_DOCKER_REPO: ${{ secrets.LOADTEST_REGISTRY }}
        run: |
          make loadtest-setup
          docker tag bouine:loadtest "$KO_DOCKER_REPO/bouine:loadtest-${{ github.sha }}"
          docker push "$KO_DOCKER_REPO/bouine:loadtest-${{ github.sha }}" || true

      - name: Deploy 3-node cluster
        run: |
          make test-k8s-setup
          kubectl -n bouine-test rollout status statefulset/bouine --timeout=120s

      - name: Run cluster scenarios
        run: make loadtest-cluster

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loadtest-cluster-${{ github.run_id }}
          path: bench/loadtest/results/
          retention-days: 30

      - name: Teardown
        if: always()
        run: make test-k8s-teardown

  # -------------------------------------------------------------------------
  # §5.6a–d dashboard-under-load (lightweight, runs on cluster runner)
  # -------------------------------------------------------------------------
  dashboard-load:
    name: Dashboard under load (§5.6a–d)
    runs-on: [self-hosted, load-test-k8s]
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.scenarios == 'dashboard' ||
      github.event.inputs.scenarios == 'all'
    timeout-minutes: 60
    needs: [cluster]

    steps:
      - uses: actions/checkout@v7

      - name: Install k6
        run: command -v k6 || pip install k6 2>/dev/null || true

      - name: Install make if missing
        run: |
          # Same self-heal as the cluster job: the load-test-k8s runner
          # image has historically missed make.
          if ! command -v make &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends make
          fi

      - name: Run §5.6a–d
        env:
          ADMIN_TOKEN: dev-secret
        run: make loadtest-dashboard

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loadtest-dashboard-${{ github.run_id }}
          path: bench/loadtest/results/
          retention-days: 30
