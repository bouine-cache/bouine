name: Pre-release

# Manual-only workflow for building and pushing a pre-release Docker image
# and Helm chart package from any branch, without merging to main or cutting
# a release tag. Restricted to @bouine-cache/maintainers via the "maintainers"
# GitHub environment (required reviewer). Nothing here ever tags "latest" or
# publishes to the official chart repository — those are reserved for release.yml
# and chart-release.yml respectively.
#
# Usage:
#   gh workflow run prerelease.yml \
#     -r <branch> \
#     -f tag=pr-42-abc123 \
#     -f skip_trivy=false
#
# Then update k8s/bouine-values.yaml in bouine-infra:
#   image:
#     tag: "pr-42-abc123"
# and run `make deploy-helm`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker Hub tag (e.g. pr-42-abc123, test-0.4.3-rc1)"
        required: true
        type: string
      skip_trivy:
        description: "Skip Trivy vulnerability scan (useful when the scan blocks a needed image)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: prerelease-${{ inputs.tag }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: bouinecache/bouine

jobs:
  docker:
    name: Docker image (pre-release)
    runs-on: [self-hosted, ci]
    environment: maintainers
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::Tag is required"
            exit 1
          fi
          # Reject anything that could be mistaken for a release or latest tag.
          case "$TAG" in
            latest|nightly) echo "::error::Tag '$TAG' is reserved"; exit 1 ;;
            v[0-9].[0-9]*)  echo "::error::Tag '$TAG' looks like a release version (vX.Y.Z). Use a pre-release tag like pr-42-abc123."; exit 1 ;;
          esac
          # Docker tags: lowercase, [a-z0-9._-], max 128 chars.
          if ! echo "$TAG" | grep -qE '^[a-z0-9._-]{1,128}$'; then
            echo "::error::Tag '$TAG' is not a valid Docker tag (lowercase, [a-z0-9._-], max 128 chars)"
            exit 1
          fi
          echo "Using pre-release tag: $TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }}

      - name: Get build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=pre-${{ inputs.tag }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan pre-release image (Trivy)
        if: ${{ !inputs.skip_trivy }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker image
        run: |
          cosign sign --yes \
            "${{ env.DOCKER_IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Summary
        run: |
          echo "## Pre-release image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull: \`${{ env.DOCKER_IMAGE }}:${{ inputs.tag }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To deploy, update \`image.tag\` in \`k8s/bouine-values.yaml\` (bouine-infra) to \`${{ inputs.tag }}\` and run \`make deploy-helm\`." >> "$GITHUB_STEP_SUMMARY"

  helm-chart:
    name: Helm chart (pre-release)
    runs-on: [self-hosted, ci]
    environment: maintainers
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Package chart with pre-release version
        run: |
          set -euo pipefail
          # Set appVersion to the pre-release tag so helm can correlate the
          # chart with the image. The --version flag sets the chart package
          # version; we only need to patch appVersion in Chart.yaml.
          sed -i "s/^appVersion:.*/appVersion: \"$TAG\"/" deploy/helm/bouine/Chart.yaml
          mkdir -p .cr-release-packages
          helm package deploy/helm/bouine \
            --destination .cr-release-packages \
            --version "$TAG"
          echo "## Helm chart packaged" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Chart version: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the .tgz from the workflow artifacts, then:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "helm upgrade --install bouine ./bouine-$TAG.tgz \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  --namespace thylong-innerspace \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  --values k8s/bouine-values.yaml" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: bouine-chart-${{ inputs.tag }}
          path: .cr-release-packages/*.tgz
          retention-days: 14
