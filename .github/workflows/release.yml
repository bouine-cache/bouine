name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  GO_VERSION: "1.26.5"
  DOCKER_IMAGE: bouinecache/bouine

jobs:
  binaries:
    name: Build binaries
    runs-on: [self-hosted, ci]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build (multi-arch)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          platforms=(
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
          )
          for os_arch in "${platforms[@]}"; do
            GOOS=${os_arch%/*}
            GOARCH=${os_arch#*/}
            bin="bouine-${VERSION}-${GOOS}-${GOARCH}"
            echo ">> building $bin"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -trimpath \
              -ldflags "-s -w \
                -X github.com/bouine-cache/bouine/internal/buildinfo.Version=$VERSION \
                -X github.com/bouine-cache/bouine/internal/buildinfo.Commit=$GITHUB_SHA \
                -X github.com/bouine-cache/bouine/internal/buildinfo.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "dist/${bin}" ./cmd/bouine
          done
          cd dist
          sha256sum bouine-* > SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ./
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
          output-file: dist/bouine-${{ github.ref_name }}.spdx.json

      - name: Sign checksums
        uses: sigstore/cosign-installer@v4
      - run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # The application release owns the repo "Latest" pointer that the
          # docs install one-liner resolves via the releases/latest API. The
          # chart release (helm/chart-releaser) sets mark_as_latest: false.
          make_latest: true
          files: |
            dist/bouine-*
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem

  docker:
    name: Docker Hub (multi-arch)
    runs-on: [self-hosted, ci]
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan released image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign Docker image
        run: |
          cosign sign --yes \
            "${{ env.DOCKER_IMAGE }}@${{ steps.build.outputs.digest }}"
