name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  GO_VERSION: "1.26.3"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build (multi-arch)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for os_arch in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${os_arch%/*}
            GOARCH=${os_arch#*/}
            out="dist/bouine_${VERSION}_${GOOS}_${GOARCH}"
            echo ">> building $out"
            GOOS=$GOOS GOARCH=$GOARCH go build \
              -trimpath \
              -ldflags "-s -w \
                -X github.com/thylong/bouine/internal/buildinfo.Version=$VERSION \
                -X github.com/thylong/bouine/internal/buildinfo.Commit=$GITHUB_SHA \
                -X github.com/thylong/bouine/internal/buildinfo.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "$out" ./cmd/bouine
            (cd dist && tar -czf "$(basename "$out").tar.gz" "$(basename "$out")")
            sha256sum "$out.tar.gz" >> dist/SHA256SUMS || shasum -a 256 "$out.tar.gz" >> dist/SHA256SUMS
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          artifact-name: bouine-${{ github.ref_name }}.spdx.json
          output-file: dist/bouine-${{ github.ref_name }}.spdx.json

      - name: Sign artifacts with cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign SHA256SUMS
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
            dist/bouine-${{ github.ref_name }}.spdx.json
