version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/bouine-cache/bouine

linters:
  default: none
  enable:
    # Mandated set from AGENTS.md §14.4
    - govet
    - staticcheck
    - errcheck
    - gosec
    - bodyclose
    - contextcheck
    - noctx
    - nilerr
    - gocritic
    - revive
    - forbidigo
    - gocyclo
    - funlen
    - depguard
    - unparam
    - ineffassign
    - unused
    - misspell

  settings:
    gocyclo:
      min-complexity: 15

    funlen:
      lines: 80
      statements: 50
      ignore-comments: true

    forbidigo:
      forbid:
        - pattern: '^fmt\.Print(|f|ln)$'
          msg: "Use slog. fmt.Print is forbidden outside main (AGENTS.md §4)."
        - pattern: '^panic$'
          msg: "panic is forbidden outside main. Return a typed error (AGENTS.md §4)."
        - pattern: '^os\.Exit$'
          msg: "os.Exit is forbidden outside main (AGENTS.md §4)."

    revive:
      severity: warning
      rules:
        - name: var-naming
        - name: exported
        - name: indent-error-flow
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: increment-decrement
        - name: range
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unused-parameter
          disabled: true
        - name: unreachable-code

    depguard:
      rules:
        # Fiber was dropped in ADR-0006 (superseded by ADR-0034).
        # fasthttp is now the sole HTTP stack (ADR-0034). Deny Fiber
        # but allow fasthttp in all packages.
        no-fiber:
          list-mode: lax
          deny:
            - pkg: "github.com/gofiber/fiber/v3"
              desc: "Fiber dropped (ADR-0006). Use fasthttp (ADR-0034)."
            - pkg: "github.com/gofiber/fiber/v2"
              desc: "Fiber dropped (ADR-0006). Use fasthttp (ADR-0034)."
        no-banned-log-libs:
          list-mode: lax
          deny:
            - pkg: "github.com/sirupsen/logrus"
              desc: "Use slog (AGENTS.md §5)."
            - pkg: "go.uber.org/zap"
              desc: "Use slog (AGENTS.md §5)."
        # Layer-dependency matrix from AGENTS.md §3.1.
        # A package may only depend on packages in lower layers (or itself
        # and stdlib). The reference definition is lint/depguard.yaml.
        server:
          list-mode: strict
          files: ["**/internal/server/**"]
          allow:
            - $gostd
            - github.com/bouine-cache/bouine/internal/server
            - github.com/bouine-cache/bouine/internal/observability
            - github.com/bouine-cache/bouine/internal/buildinfo
            - github.com/bouine-cache/bouine/internal/platform
            - github.com/bouine-cache/bouine/pkg/api
            - github.com/bouine-cache/bouine/pkg/header
            - github.com/valyala/fasthttp
            - golang.org/x/sync
            - golang.org/x/sys
        storage-L2:
          list-mode: strict
          files: ["**/internal/storage/**"]
          allow:
            - $gostd
            - github.com/bouine-cache/bouine/internal/storage
            - github.com/bouine-cache/bouine/internal/observability
            - github.com/bouine-cache/bouine/internal/platform
            - github.com/bouine-cache/bouine/pkg/api
            - github.com/bouine-cache/bouine/pkg/header
            - github.com/bouine-cache/xxhash/v3
            - github.com/prometheus/client_golang
            - golang.org/x/sync
            - golang.org/x/sys
        cache-L3:
          list-mode: strict
          files: ["**/internal/cache/**"]
          allow:
            - $gostd
            - github.com/bouine-cache/bouine/internal/cache
            - github.com/bouine-cache/bouine/internal/storage
            - github.com/bouine-cache/bouine/internal/origin
            - github.com/bouine-cache/bouine/internal/observability
            - github.com/bouine-cache/bouine/internal/platform
            - github.com/bouine-cache/bouine/pkg/api
            - github.com/bouine-cache/bouine/pkg/header
            - github.com/bouine-cache/xxhash/v3
            - github.com/valyala/fasthttp
            - golang.org/x/sync
        origin-L4:
          list-mode: strict
          files: ["**/internal/origin/**"]
          allow:
            - $gostd
            - github.com/bouine-cache/bouine/internal/origin
            - github.com/bouine-cache/bouine/internal/observability
            - github.com/bouine-cache/bouine/pkg/api
            - github.com/bouine-cache/bouine/pkg/header
            - github.com/prometheus/client_golang
            - github.com/valyala/fasthttp
            - github.com/bouine-cache/bouine/internal/transport
            - golang.org/x/sync
        staticfile-L4:
          list-mode: strict
          files: ["**/internal/staticfile/**"]
          allow:
            - $gostd
            - github.com/bouine-cache/bouine/internal/staticfile
            - github.com/bouine-cache/bouine/internal/observability
            - github.com/bouine-cache/bouine/pkg/header
            - github.com/bouine-cache/xxhash/v3
            - github.com/prometheus/client_golang
            - github.com/valyala/fasthttp
        cluster-L5:
          list-mode: strict
          files: ["**/internal/cluster/**"]
          allow:
            - $gostd
            - github.com/bouine-cache/bouine/internal/cluster
            - github.com/bouine-cache/bouine/internal/cache
            - github.com/bouine-cache/bouine/internal/storage
            - github.com/bouine-cache/bouine/internal/config
            - github.com/bouine-cache/bouine/internal/observability
            - github.com/bouine-cache/bouine/pkg/api
            - github.com/bouine-cache/bouine/pkg/header
            - github.com/hashicorp/memberlist
            - github.com/bouine-cache/xxhash/v3
            - github.com/prometheus/client_golang
            - github.com/valyala/fasthttp
            - github.com/bouine-cache/bouine/internal/transport
            - golang.org/x/sync
        admin-L6:
          list-mode: strict
          files: ["**/internal/admin/**"]
          allow:
            - $gostd
            - github.com/bouine-cache/bouine/internal/admin
            - github.com/bouine-cache/bouine/internal/cache
            - github.com/bouine-cache/bouine/internal/storage
            - github.com/bouine-cache/bouine/internal/cluster
            - github.com/bouine-cache/bouine/internal/config
            - github.com/bouine-cache/bouine/internal/observability
            - github.com/bouine-cache/bouine/internal/buildinfo
            - github.com/bouine-cache/bouine/pkg/api
            - github.com/bouine-cache/bouine/pkg/header
            - github.com/prometheus/client_golang
            - github.com/valyala/fasthttp
            - github.com/valyala/fasthttp/fasthttpadaptor
        observability-L7:
          list-mode: strict
          files: ["**/internal/observability/**"]
          allow:
            - $gostd
            - github.com/bouine-cache/bouine/internal/observability
            - github.com/bouine-cache/bouine/internal/transport
            - github.com/bouine-cache/bouine/pkg/api
            - github.com/bouine-cache/bouine/pkg/header
            - github.com/prometheus/client_golang
            - github.com/prometheus/client_model/go
            - go.opentelemetry.io/otel
            - github.com/valyala/fasthttp
        ai-L8:
          list-mode: strict
          files: ["**/internal/ai/**"]
          allow:
            - $gostd
            - github.com/bouine-cache/bouine/internal/ai
            - github.com/bouine-cache/bouine/internal/admin
            - github.com/bouine-cache/bouine/internal/observability
            - github.com/bouine-cache/bouine/pkg/api
            - github.com/bouine-cache/bouine/pkg/header
        public-api-leaf:
          list-mode: strict
          files:
            - "**/pkg/api/**"
            - "**/pkg/bouineapi/**"
          allow:
            - $gostd
            - github.com/bouine-cache/bouine/pkg/api
            - github.com/bouine-cache/bouine/pkg/bouineapi
            - github.com/bouine-cache/bouine/pkg/header
            - github.com/valyala/fasthttp
        transport:
          list-mode: strict
          files: ["**/internal/transport/**"]
          allow:
            - $gostd
            - github.com/bouine-cache/bouine/internal/transport
            - github.com/valyala/fasthttp
        config-leaf:
          list-mode: strict
          files: ["**/internal/config/**"]
          allow:
            - $gostd
            - github.com/bouine-cache/bouine/internal/config
            - github.com/bouine-cache/bouine/pkg/api
            - github.com/bouine-cache/bouine/pkg/header
            - gopkg.in/yaml.v3
            - github.com/fsnotify/fsnotify
        runtime-leaf:
          list-mode: strict
          files: ["**/internal/runtime/**"]
          allow:
            - $gostd
            - github.com/bouine-cache/bouine/internal/runtime
            - github.com/bouine-cache/bouine/internal/observability
            - github.com/bouine-cache/bouine/pkg/api
            - github.com/bouine-cache/bouine/pkg/header
            - golang.org/x/sync

  exclusions:
    rules:
      # Test files relax some discipline; explicitly justified.
      - path: "_test\\.go"
        linters:
          - funlen
          - gocyclo
          - gosec
          - forbidigo
          - errcheck
          - noctx
          - depguard
      # SA5011 (possible nil pointer dereference after nil check) is a
      # false positive in tests: t.Fatal calls runtime.Goexit and never
      # returns, but staticcheck does not model that.
      - path: "_test\\.go"
        linters:
          - staticcheck
        text: "SA5011"
      # main packages may exit and print.
      - path: "cmd/.*"
        linters:
          - forbidigo
      # Operator scripts are CLI tools; same rules as cmd/.
      - path: "scripts/.*"
        linters:
          - forbidigo
      # Test-fixture origin server is not production code.
      - path: "test/integration/.*"
        linters:
          - forbidigo
          - errcheck
          - gosec
          - noctx
          - funlen
          - gocyclo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
