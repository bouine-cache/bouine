header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: Théotime Levêque

  paths-ignore:
    - 'dist'
    - '.gitignore'
    - '.dockerignore'
    - 'Dockerfile'
    - 'docker-compose.yaml'
    - '.golangci.yaml'
    - '.licenserc.yaml'
    - '.envrc'
    - 'vendor'
    - 'Makefile'
    - 'licenses'
    - '**/*.md'
    - '**/*.json'
    - '**/*_test.go'
    - '**/*.service'
    - '**/go.mod'
    - '**/go.sum'
    - 'scripts/wait-for-it.sh'
    - 'LICENSE'
    - 'NOTICE'

  comment: on-failure

dependency:
  files:
  - go.mod
