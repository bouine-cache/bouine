header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: Théotime Levêque

  paths-ignore:
    - 'dist'
    - '.gitignore'
    - '.dockerignore'
    - 'Dockerfile'
    - 'docker-compose.yaml'
    - '.golangci.yaml'
    - '.licenserc.yaml'
    - '.pre-commit-config.yaml'
    - '.envrc'
    - 'vendor'
    - 'Makefile'
    - 'licenses'
    - '**/*.md'
    - '**/*.json'
    - '**/*_test.go'
    - '**/*.service'
    - '**/go.mod'
    - '**/go.sum'
    - 'scripts/wait-for-it.sh'
    - 'LICENSE'
    - 'NOTICE'
    - 'pkg/serializer/proto/service.proto'
    - 'pkg/serializer/proto/service.pb.go'
    - 'pkg/serializer/proto/service_grpc.pb.go'
    - 'third_party/nginx-load-balancer/nginx.conf'
    - 'cmd/cli/cli.go'
    - 'cmd/cli/root.go'
    - 'cmd/root.go'
    - 'cmd/server.go'

  comment: on-failure

dependency:
  files:
  - go.mod
