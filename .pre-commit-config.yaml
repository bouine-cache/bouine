# Pre-commit configuration for bouine.
#
# This file is the local mirror of CI's first stage. Every contributor
# (human or AI) MUST run these hooks before each commit. Bypassing is
# forbidden (AGENTS.md §2.11).
#
# Setup:
#   brew install pre-commit        # or: pip install pre-commit
#   make hooks                     # installs commit + commit-msg + pre-push hooks
#
# Run on all files:
#   pre-commit run --all-files

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

default_stages:
  - pre-commit

repos:
  # ---------------------------------------------------------------------
  # Generic file hygiene + YAML check.
  # ---------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^deploy/helm/.*/templates/
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^testdata/

  # ---------------------------------------------------------------------
  # Go: format, vet, tests, golangci-lint, mod tidy.
  # ---------------------------------------------------------------------
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint-full
        # On commit, only changed lines (fast). On pre-push the full repo
        # is exercised by the local hook below.
        args: [--new-from-rev=HEAD~, --config=.golangci.yaml]

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt -s
        entry: gofmt -s -w -l
        language: system
        types: [go]
        pass_filenames: true

      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'go mod tidy && git diff --exit-code go.mod go.sum'
        language: system
        files: '(^go\.mod|^go\.sum|\.go)$'
        pass_filenames: false

      - id: go-test-short
        name: go test -race -short
        entry: go test -race -count=1 -timeout=60s -short ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test-full
        name: go test -race (full)
        entry: go test -race -count=1 -timeout=180s ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

      - id: govulncheck
        name: govulncheck
        entry: bash -c 'command -v govulncheck >/dev/null || go install golang.org/x/vuln/cmd/govulncheck@latest; govulncheck ./...'
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

  # ---------------------------------------------------------------------
  # Helm: lint the chart on both commit and push when chart files change.
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint (deploy/helm/bouine)
        entry: helm lint deploy/helm/bouine
        language: system
        files: ^deploy/helm/bouine/
        pass_filenames: false
        stages: [pre-commit, pre-push]

  # ---------------------------------------------------------------------
  # Secret scan.
  # ---------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------
  # Conventional Commits — validates the commit message header.
  # ---------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - chore
          - docs
          - refactor
          - test
          - perf
          - build
          - ci

  # ---------------------------------------------------------------------
  # Block AI-assistant trailers and internal-plan artifact names from
  # entering commit messages (history was scrubbed of these; keep it clean).
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: no-assistant-or-plan-trailers
        name: block Crush trailers and internal-plan tokens in commit messages
        entry: >-
          bash -c 'if grep -qiE "Generated with Crush|Assisted-by: *Crush|PLAN_MEMORY_PRESSURE|PLAN_LOADTEST|PLAN_UX" "$1"; then
          echo "commit message contains a forbidden AI-assistant trailer or internal-plan token"; exit 1; fi' --
        language: system
        stages: [commit-msg]
