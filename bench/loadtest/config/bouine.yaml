listen:
  http: ":8080"
  admin: ":9000"

admin:
  # Set BOUINE_ADMIN_TOKEN in the environment (or .env file at the repo
  # root) to rotate this token without editing a committed file.
  # CI: inject via a repository secret → BOUINE_ADMIN_TOKEN env var.
  token: "loadtest-token"
  # Enabled for the PGO capture legs (bench/pgo/run.sh) and general
  # profiling under load. The admin port is not published beyond
  # localhost:9000 in this topology.
  pprof_enabled: true

storage:
  hot_max_bytes: 1GiB

# The H1 fast path serves cache hits from a zero-allocation HTTP/1.1
# parser, bypassing the fasthttp middleware chain. Benchmarks comparing
# against nginx/varnish/envoy must exercise it — all previous rounds
# accidentally measured the slow middleware path.
experimental:
  h1_fast_path: true

upstream_pools:
  - name: origin
    targets:
      - "origin:8080"
    health:
      passive:
        consecutive_5xx: 10

routes:
  - name: "default"
    match:
      path_prefix: "/"
    pool: origin
    cache:
      negative_ttl: "5s"
      stale_while_revalidate: "30s"
      jitter_percent: 5
