listen:
  http: ":8080"
  admin: ":9000"

admin:
  # Set BOUINE_ADMIN_TOKEN in the environment (or .env file at the repo
  # root) to rotate this token without editing a committed file.
  # CI: inject via a repository secret → BOUINE_ADMIN_TOKEN env var.
  token: "loadtest-token"
  # Enabled for the PGO capture legs (bench/pgo/run.sh) and general
  # profiling under load. The admin port is not published beyond
  # localhost:9000 in this topology.
  pprof_enabled: true

storage:
  hot_max_bytes: 1GiB

# The H1 fast path (zero-allocation HTTP/1.1 parser serving cache hits,
# bypassing the fasthttp middleware chain) is the default path since
# ADR-0069 — no flag needed. Benchmarks against nginx/varnish/envoy
# exercise it by construction.

upstream_pools:
  - name: origin
    targets:
      - "origin:8080"
    health:
      passive:
        consecutive_5xx: 10
        # Explicit so harness behavior is pinned: the built-in default is
        # the same 30s, but the load-test topology must not depend on
        # built-in defaults. Without a window, one transient error burst
        # used to eject the single origin target for the rest of the run
        # (measured: 22 errors -> 53k instant 502s in one leg).
        eject_for: "30s"
    # 640 covers the worst concurrent origin demand of the default
    # admission chain on this route: 256 foreground fetch slots
    # (routes[].cache.max_fetch_concurrency) + 256 SWR revalidations
    # (revalSem) + 8 background refreshes. The fasthttp pool has no
    # wait configured, so a cap below the semaphores turns bursts into
    # instant 502s instead of queueing.
    connect:
      max_connections: 640

routes:
  - name: "default"
    match:
      path_prefix: "/"
    pool: origin
    cache:
      negative_ttl: "5s"
      stale_while_revalidate: "30s"
      jitter_percent: 5
      # Little's law for the harness's miss-heavy scenarios (§3.3/§3.6
      # style: up to 10% misses at 25k RPS against a 50 ms origin needs
      # 125 slots): 256 gives 2x headroom. The former implicit 32-slot
      # default shed 75% of misses at that point.
      max_fetch_concurrency: 256
      # Shed waits are cheap-ish but not free: every shed request burns
      # the full wait before its 503. 250ms keeps burst absorption
      # without making a saturated origin park connections for a
      # meaningful fraction of the client timeout.
      fetch_wait_timeout: "250ms"
