apiVersion: 1

datasources:
  - name: InfluxDB_v1
    type: influxdb
    access: proxy
    database: myk6db
    # user: grafana
    org_id: 1
    url: 'http://influxdb:8086'
    is_default: true
    version: 1
    editable: true
    jsonData:
      httpMode: GET
    # secureJsonData:
    #   password: grafana