# Codecov configuration for bouine
# Per-package coverage targets follow AGENTS.md §8:
#   - 85% default across all packages
#   - 95% for internal/cache and internal/storage (the core tiers)
# Free for public/OSS repos — no paid plan required.
coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 1%
      cache:
        target: 95%
        threshold: 1%
        paths:
          - internal/cache
      storage:
        target: 95%
        threshold: 1%
        paths:
          - internal/storage
    # No patch status — the project-level checks already guard against
    # regressions (untested code lowers the package total). The patch
    # check penalizes PRs for I/O error wrappers and doc comments that
    # add no executable statements, without catching real gaps.
    # See ADR-0030 for rationale.

comment:
  layout: "reach,diff,flags,files,footer"
  show_carryforward_flags: false

github_checks:
  annotations: false

ignore:
  - "**/*_templ.go"
  - "**/testdata/**"
  - "**/doc.go"
  - "cmd/**"
  - "pkg/api/**"
  - "internal/dashboard/insights/**"
  - "internal/testutil/**"
