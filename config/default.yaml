# Minimal default configuration for containerized bouine.
# Override by mounting your own config at /etc/bouine/config.yaml.

listen:
  http: ":80"
  admin: ":9000"
  # max_connections caps simultaneously open data-plane connections.
  # Under HTTP/1.1 a request holds its connection, so this also bounds
  # in-flight requests and the goroutine pile a slow origin can cause
  # (issue #562). Over-limit connections get 503 + close at accept.
  # Note: idle keep-alive connections hold a slot too — size for your
  # client population, not just peak concurrency.
  max_connections: 4096
  # idle_timeout is the keep-alive idle timeout for data-plane
  # connections (default 120s). Lower it when a front-end proxies to
  # bouine so IT closes idle connections first, and keep it above your
  # clients' idle behaviour. With an nginx front-end, keep nginx's
  # keepalive_timeout below this value — otherwise bouine can close a
  # connection nginx is about to reuse and nginx logs
  # "upstream prematurely closed connection".
  # idle_timeout: 120s

storage:
  hot_max_bytes: 512MiB
  # wal_sync_interval controls the async WAL fsync batching interval.
  # Default 100ms. Entries are enqueued to a bounded channel and
  # fsynced in batches by a background goroutine. Set to -1 for
  # synchronous mode (per-entry fsync, same as pre-ADR-0024 behavior).
  # See ADR-0024.
  wal_sync_interval: 100ms
  # tombstone_queue_size controls the buffer size of the hot→warm
  # tombstone channel. Default 65536. Increasing this reduces drops
  # under bursty eviction pressure.
  # tombstone_queue_size: 65536
  # tombstone_drain_interval controls how often the dedicated drain
  # goroutine flushes the tombstone and warm-evict queues to the warm
  # tier + WAL. Default 1s. Set to -1 to disable the dedicated drain
  # goroutine (drains only on the warm sync cycle). See ADR-0029.
  # tombstone_drain_interval: 1s

admin:
  # SECURITY: set a strong, unique token before exposing port 9000.
  # If this field is omitted bouine auto-generates a random token at
  # startup and logs it at INFO level — check container logs to retrieve it.
  # Example (Kubernetes): inject via a Secret mounted as a config volume
  # or use --admin-token-file pointing at a secrets volume.
  # token: "REPLACE_ME"
