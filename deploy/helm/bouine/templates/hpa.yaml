{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "bouine.fullname" . }}
  labels:
    {{- include "bouine.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "bouine.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.rpsTrigger }}
    - type: Pods
      pods:
        metric:
          name: {{ .Values.autoscaling.rpsTrigger.metricName | default "bouine_requests_per_second" }}
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.rpsTrigger.averageValue | default "100" }}
    {{- end }}
    {{- if .Values.autoscaling.cpuTrigger }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: {{ .Values.autoscaling.cpuTrigger.targetType | default "Utilization" }}
          {{- if eq .Values.autoscaling.cpuTrigger.targetType "AverageValue" }}
          averageValue: {{ .Values.autoscaling.cpuTrigger.averageValue }}
          {{- else }}
          averageUtilization: {{ .Values.autoscaling.cpuTrigger.averageUtilization }}
          {{- end }}
    {{- end }}
  behavior:
    scaleUp:
      stabilizationSeconds: {{ .Values.autoscaling.scaleUpStabilizationSeconds | default 120 }}
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationSeconds: {{ .Values.autoscaling.scaleDownStabilizationSeconds | default 300 }}
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- end }}
