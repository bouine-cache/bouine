{{- if and .Values.networkPolicy .Values.networkPolicy.enabled }}
{{- /* NetworkPolicy matches post-DNAT ports: the container ports derived
  from config.listen, not the Service ports. Under default values the two
  coincide; with listen overrides only the container ports are correct
  (issue #586). An empty listen address disables the plane, and its
  derived rule with it. */}}
{{- $httpPort := include "bouine.listenPort" (dict "key" "http" "value" .Values.config.listen.http) }}
{{- $httpsPort := include "bouine.listenPort" (dict "key" "https" "value" .Values.config.listen.https) }}
{{- $adminPort := include "bouine.listenPort" (dict "key" "admin" "value" .Values.config.listen.admin) }}
{{- $clusterPort := include "bouine.listenPort" (dict "key" "cluster" "value" .Values.config.listen.cluster) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bouine.fullname" . }}
  labels:
    {{- include "bouine.labels" . | nindent 4 }}
  {{- include "bouine.annotations" (list . .Values.networkPolicy.annotations) | nindent 2 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bouine.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Data-plane ports: allow from any source.
    - ports:
      {{- if $httpPort }}
        - port: {{ $httpPort }}
          protocol: TCP
      {{- end }}
      {{- if $httpsPort }}
        - port: {{ $httpsPort }}
          protocol: TCP
      {{- end }}
    {{- if $adminPort }}
    # Admin port: allow from same namespace only.
    - from:
        - podSelector: {}
      ports:
        - port: {{ $adminPort }}
          protocol: TCP
    {{- end }}
    {{- if $clusterPort }}
    # Cluster gossip: allow from bouine pods only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "bouine.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ $clusterPort }}
          protocol: TCP
        - port: {{ $clusterPort }}
          protocol: UDP
    {{- end }}
{{- end }}
