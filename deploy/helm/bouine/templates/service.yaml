apiVersion: v1
kind: Service
metadata:
  name: {{ include "bouine.fullname" . }}
  labels:
    {{- include "bouine.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    bouine-cache.io/plane: data
  {{- include "bouine.annotations" (list . .Values.service.annotations) | nindent 2 }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: https
      port: {{ .Values.service.httpsPort }}
      targetPort: https
      protocol: TCP
  selector:
    {{- include "bouine.selectorLabels" . | nindent 4 }}
---
# Dedicated admin (management plane) Service. ClusterIP by default so the
# admin surface is never exposed by a data-plane LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bouine.adminServiceName" . }}
  labels:
    {{- include "bouine.labels" . | nindent 4 }}
    {{- with .Values.adminService.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    bouine-cache.io/plane: management
  {{- include "bouine.annotations" (list . .Values.adminService.annotations) | nindent 2 }}
spec:
  type: {{ .Values.adminService.type | default "ClusterIP" }}
  ports:
    - name: admin
      port: {{ .Values.adminService.port | default .Values.service.adminPort }}
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "bouine.selectorLabels" . | nindent 4 }}
---
# Headless service for gossip peer discovery (StatefulSet DNS).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bouine.fullname" . }}-headless
  labels:
    {{- include "bouine.labels" . | nindent 4 }}
    bouine-cache.io/plane: control
  {{- include "bouine.annotations" (list . (dict)) | nindent 2 }}
spec:
  clusterIP: None
  ports:
    - name: cluster-tcp
      port: {{ .Values.headlessService.clusterPort }}
      targetPort: cluster
      protocol: TCP
    - name: cluster-udp
      port: {{ .Values.headlessService.clusterPort }}
      targetPort: cluster-udp
      protocol: UDP
  selector:
    {{- include "bouine.selectorLabels" . | nindent 4 }}
