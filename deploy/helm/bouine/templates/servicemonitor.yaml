{{- if and .Values.serviceMonitor .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "bouine.fullname" . }}
  labels:
    {{- include "bouine.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- include "bouine.annotations" (list . .Values.serviceMonitor.annotations) | nindent 2 }}
spec:
  selector:
    matchLabels:
      {{- include "bouine.selectorLabels" . | nindent 6 }}
      # Scrape via the dedicated admin Service (it carries the plane
      # label); the data-plane Service does not expose an admin port.
      bouine-cache.io/plane: management
  endpoints:
    - port: admin
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval | default "60s" }}
      {{- if .Values.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- end }}
      {{- with .Values.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
