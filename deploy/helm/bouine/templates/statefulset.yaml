apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bouine.fullname" . }}
  labels:
    {{- include "bouine.labels" . | nindent 4 }}
    {{- with .Values.statefulsetLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- include "bouine.annotations" (list . .Values.statefulsetAnnotations) | nindent 2 }}
spec:
  serviceName: {{ include "bouine.fullname" . }}-headless
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  podManagementPolicy: {{ .Values.podManagementPolicy | default "Parallel" }}
  minReadySeconds: {{ .Values.minReadySeconds | default 30 }}
  updateStrategy:
    type: {{ .Values.updateStrategy.type | default "RollingUpdate" }}
    {{- if eq (.Values.updateStrategy.type | default "RollingUpdate") "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.updateStrategy.maxUnavailable | default 1 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "bouine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "bouine.selectorLabels" . | nindent 8 }}
      {{- /* The computed checksum must never be clobbered by user values. */}}
      {{- $podAnnotations := mergeOverwrite (dict) .Values.podAnnotations (dict "checksum/config" (include (print $.Template.BasePath "/configmap.yaml") . | sha256sum)) }}
      {{- include "bouine.annotations" (list . $podAnnotations) | nindent 6 }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "bouine.fullname" .) }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . | quote }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if .Values.podAntiAffinity }}
      affinity:
        podAntiAffinity:
          {{- toYaml .Values.podAntiAffinity | nindent 10 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      containers:
        - name: bouine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - serve
            - --config=/etc/bouine/config.yaml
            - --log-format=json
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # GC tuning: keep pauses small relative to the memory limit.
            # GOMEMLIMIT is auto-computed as 75% of resources.limits.memory
            # by the bouine.goMemLimit helper. Set goMemLimit in values.yaml
            # to override with a manual value.
            - name: GOMEMLIMIT
              value: "{{ include "bouine.goMemLimit" . }}"
            - name: GOGC
              value: "{{ .Values.goGC | default "100" }}"
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- end }}
            {{- if and .Values.cloudflare .Values.cloudflare.apiTokenSecretName }}
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflare.apiTokenSecretName }}
                  key: {{ .Values.cloudflare.apiTokenSecretKey | default "CF_API_TOKEN" }}
            {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: admin
              containerPort: 9000
              protocol: TCP
            - name: cluster
              containerPort: 8443
              protocol: TCP
            - name: cluster-udp
              containerPort: 8443
              protocol: UDP
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/bouine
              readOnly: true
            {{- if .Values.warmVolume.enabled }}
            - name: warm
              mountPath: /var/lib/bouine
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: admin
      volumes:
        - name: config
          configMap:
            name: {{ include "bouine.fullname" . }}-config
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if .Values.warmVolume.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: warm
        {{- with .Values.commonLabels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.warmVolume.labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- include "bouine.annotations" (list . .Values.warmVolume.annotations) | nindent 8 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.warmVolume.storageClass }}
        storageClassName: {{ .Values.warmVolume.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.warmVolume.size }}
  {{- if .Values.persistentVolumeClaimRetentionPolicy.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenScaled: {{ .Values.persistentVolumeClaimRetentionPolicy.whenScaled | default "Retain" }}
    whenDeleted: {{ .Values.persistentVolumeClaimRetentionPolicy.whenDeleted | default "Retain" }}
  {{- end }}
  {{- end }}
