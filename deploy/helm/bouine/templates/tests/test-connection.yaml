{{- $adminSvc := include "bouine.adminServiceName" . }}
{{- $adminPort := .Values.adminService.port | default .Values.service.adminPort }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "bouine.fullname" . }}-test"
  labels:
    {{- include "bouine.labels" . | nindent 4 }}
  {{- include "bouine.annotations" (list . (dict "helm.sh/hook" "test" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded")) | nindent 2 }}
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl-healthz
      image: curlimages/curl:8.14.1
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      command:
        - curl
        - -sf
        - --max-time
        - "10"
        - http://{{ $adminSvc }}.{{ .Release.Namespace }}.svc.cluster.local:{{ $adminPort }}/healthz
