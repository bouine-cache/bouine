apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "bouine.fullname" . }}-test"
  labels:
    {{- include "bouine.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl-healthz
      image: curlimages/curl:8.14.1
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      command:
        - curl
        - -sf
        - --max-time
        - "10"
        - http://{{ include "bouine.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.adminPort }}/healthz
