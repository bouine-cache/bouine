# Default values for the bouine Helm chart.

replicaCount: 3

image:
  repository: bouinecache/bouine
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent
  # Optional: list of Kubernetes Secret names for pulling from private registries.
  pullSecrets: []

# Service account for the bouine pods.
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount the service account token. Enable for IRSA /
  # workload identity (e.g. AWS EKS, GCP workload identity).
  automount: false
  # Annotations to add to the service account (e.g. for IRSA / workload identity).
  #  eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/bouine
  annotations: {}
  # Name of an existing service account to use when create is false.
  name: ""

nameOverride: ""
fullnameOverride: ""

# bouine config. Rendered into a ConfigMap and mounted at /etc/bouine/.
config:
  listen:
    http: ":80"
    https: ":443"
    admin: ":9000"
    cluster: ":8443"
    # max_connections caps simultaneously open data-plane connections.
    # Under HTTP/1.1 a request holds its connection, so this bounds the
    # in-flight request pile a slow origin can cause (issue #562);
    # over-limit connections get 503 + close at accept. Idle keep-alive
    # connections hold a slot too — size for your client population.
    max_connections: 4096
  tls:
    certs: []
    # Provide via a Secret mounted at /etc/bouine/tls/.
    # - cert_file: /etc/bouine/tls/tls.crt
    #   key_file: /etc/bouine/tls/tls.key
  storage:
    hot_max_bytes: 2GiB
    warm_dir: /var/lib/bouine
    warm_max_bytes: 20GiB
    warm_sync_interval: 60s  # hot→warm background sync (default); set to -1 to disable
    # warm_sync_batch_size: 5000
    # body_threshold: 64KiB
  cluster:
    join: []  # populated from headless service DNS
  # admin:
  #   drain_duration: 10s  # /drain endpoint block time (preStop hook)
  upstream_pools: []
  routes: []
  # Cloudflare Cache API invalidation propagation.
  # When zone_id and api_token are set, bouine forwards purge/ban/refresh
  # operations to the downstream Cloudflare CDN automatically.
  # cloudflare:
  #   zone_id: "abc123"           # non-secret, visible in CF dashboard URL
  #   # api_token is injected via cloudflare.apiTokenSecretName below; do
  #   # not place the token value here.
  #   propagate:
  #     purge: true
  #     ban: true
  #     refresh: true
  #   async: true                 # default; omit to keep async behaviour
  #   timeout: 10s

service:
  type: ClusterIP
  httpPort: 80
  httpsPort: 443
  adminPort: 9000

headlessService:
  # Headless service for gossip peer discovery.
  clusterPort: 8443

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 4
    memory: 8Gi

# Optional pod metadata and scheduling controls.
podAnnotations: {}
podLabels: {}
affinity: {}
# Raw pod anti-affinity rules. Explicit affinity takes precedence.
podAntiAffinity: {}
nodeSelector: {}
tolerations: []
priorityClassName: ""
dnsPolicy: ""
dnsConfig: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

podDisruptionBudget:
  enabled: true
  # minAvailable: 2 ensures at least 2 pods remain during rollout on a
  # 3-replica StatefulSet, satisfying SLO DP-5 (zero 5xx on rolling restart).
  minAvailable: 2

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

terminationGracePeriodSeconds: 40

# Pod management policy for the StatefulSet.
# Parallel: all pods start simultaneously (correct for strong-mode
# clusters where peers join via gossip concurrently).
# maxUnavailable controls rolling update concurrency — set to 1 to
# roll one pod at a time while allowing parallel initial boot.
podManagementPolicy: Parallel
updateStrategy:
  type: RollingUpdate
  maxUnavailable: 1

# Seconds after a pod becomes Ready before it enters Service endpoints.
# Gives the cluster ring time to converge after a pod joins, reducing
# the window where peer-fetch routes to a node with an incomplete ring.
minReadySeconds: 30

# preStop hook: the /drain endpoint (httpGet on the admin port) marks the
# pod as not-ready and blocks for admin.drain_duration (default 10s) so
# kube-proxy can deregister the pod before SIGTERM arrives.
# The drain duration is configured in the bouine config under admin.drain_duration.
# No exec/sleep needed — the distroless container image has no shell.

# Go runtime tuning.
# GOMEMLIMIT: leave empty (default) to auto-compute as 75% of
# resources.limits.memory via the bouine.goMemLimit helper.
# Set explicitly to override, e.g. goMemLimit: "6GiB".
# GOGC=100 (default) paired with GOMEMLIMIT keeps GC pauses bounded.
goMemLimit: ""
goGC: "100"

# Cloudflare CDN invalidation propagation.
# When zone_id and an API token are set, purge/ban/refresh operations are
# forwarded to the Cloudflare Cache API so both caches stay in sync.
#
# async: true (the default) means admin API responses return immediately while
# CF propagation runs in a background goroutine. Set to false only when you
# need synchronous confirmation (adds ~50–300 ms to every invalidation call).
#
# API token secret:
#   1. Create a Kubernetes Secret:
#        kubectl create secret generic bouine-cf-token \
#          --from-literal=CF_API_TOKEN=<your-Cache-Purge-token>
#   2. Set apiTokenSecretName below, or inject via extraEnv.
#   The operator injects CF_API_TOKEN; bouine reads it at startup as a
#   fallback when cloudflare.api_token is empty in the config file.
cloudflare:
  # apiTokenSecretName configures automatic CF_API_TOKEN injection from a
  # Kubernetes Secret.
  # apiTokenSecretName: bouine-cf-token
  # apiTokenSecretKey: "CF_API_TOKEN"  # key inside the Secret (default shown)
  #
  # Additional API tokens for rate limit spreading. When multiple tokens are
  # configured, bouine rotates across them to multiply the effective rate
  # limit budget. Inject via CF_API_TOKENS env var (comma-separated).
  # api_tokens: ["token2", "token3"]
  #
  # Batch configures purge batching and deduplication. When enabled,
  # individual purge requests are coalesced into batched, deduplicated
  # API calls to reduce CF rate limit pressure under burst traffic.
  # batch:
  #   max_batch_size: 30   # max items per CF API call (0 = passthrough)
  #   max_wait: 500ms      # max time before flush (default 500ms)
  #
  # Circuit configures the circuit breaker for CF API outage protection.
  # When enabled, the circuit opens after N consecutive failures, failing
  # fast to avoid wasting resources on a known-down API.
  # circuit:
  #   enabled: true
  #   failure_threshold: 5  # consecutive failures before opening
  #   open_timeout: 30s      # time before probing (default 30s)
  #   half_open_max_calls: 1 # probe calls in half-open state
  #
  # Retry configures the dead-letter queue for failed CF purges. Failed
  # items are retried with exponential backoff. This survives transient
  # CF outages without losing invalidations.
  # retry:
  #   enabled: true
  #   max_queue_size: 1000  # max items in queue
  #   max_retries: 3        # max retry attempts per item
  #   base_delay: 1s        # initial retry delay
  #   max_delay: 30s        # max retry delay cap

# Extra environment variables injected into the bouine container.
# Useful for secret references (e.g., admin token from a Secret):
#   extraEnv:
#     - name: BOUINE_ADMIN_TOKEN
#       valueFrom:
#         secretKeyRef:
#           name: bouine-admin-token
#           key: token
extraEnv: []

# Extra volumes to add to the bouine pod (e.g. for TLS secrets, custom CA
# bundles, or static files for self-served mode).
#   extraVolumes:
#     - name: tls-certs
#       secret:
#         secretName: bouine-tls
#     - name: static-files
#       configMap:
#         name: bouine-static
extraVolumes: []

# Extra volume mounts to add to the bouine container.
#   extraVolumeMounts:
#     - name: tls-certs
#       mountPath: /etc/bouine/tls
#       readOnly: true
#     - name: static-files
#       mountPath: /var/www/html
#       readOnly: true
extraVolumeMounts: []

startupProbe:
  httpGet:
    path: /readyz
    port: admin
  periodSeconds: 10
  failureThreshold: 180  # 30 minutes max warmup
  # Budget for warm-tier WAL replay + RecomputeStats segment scan.
  # Scale with warm-tier size: ~1 min per 10 GB of segment data at
  # 10 GiB/s mmap throughput under typical container CPU limits.
  # Anti-entropy (ring digest reconciliation) is async and not on
  # the critical path — do not confuse the two.

readinessProbe:
  httpGet:
    path: /readyz
    port: admin
  periodSeconds: 5
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: admin
  periodSeconds: 10
  failureThreshold: 5

# Horizontal Pod Autoscaler. CPU-only.
# Disabled by default. Enable in per-environment values.
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 6
  cpuTrigger:
    targetType: Utilization
    averageUtilization: 70
  scaleDownStabilizationSeconds: 300

# Volume for the warm tier.
warmVolume:
  enabled: true
  size: 50Gi
  storageClass: ""
  annotations: {}
  labels: {}

# PVC retention is disabled by default for compatibility with older clusters.
# When enabled, Retain preserves warm-tier data across StatefulSet changes.
persistentVolumeClaimRetentionPolicy:
  enabled: false
  whenScaled: Retain
  whenDeleted: Retain

# Ingress for the data-plane HTTP/HTTPS ports.
# Disabled by default — create one if you need external traffic.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Hostnames to route to the data-plane HTTP port.
  hosts: []
    # - host: cache.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  # TLS configuration for the ingress.
  tls: []
    # - secretName: cache-tls
    #   hosts:
    #     - cache.example.com

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
  labels: {}
  interval: 60s
  scrapeTimeout: ""  # uses default
  relabelings: []
  metricRelabelings: []

# PrometheusRule CRD with alerting rules for bouine SLOs.
# Requires the Prometheus Operator. Disabled by default.
# Thresholds are overridable — adjust to match your traffic patterns and
# origin characteristics. See docs/operations/slo.md for the reference SLOs.
prometheusRule:
  enabled: false
  labels: {}
  rules:
    hitLatencyThreshold: 0.002      # seconds (SLO DP-1: hit p99 > 2ms)
    errorRateThreshold: 0.01         # fraction (SLO DP-4: 5xx > 1%)
    hitRateThreshold: 0.60           # fraction (SLO DP-3: hit rate < 60%)
    peerFetchHitRateThreshold: 0.50  # fraction (SLO CL-2: peer-fetch hit rate < 50%)
    warmTierUsageThreshold: 0.90    # fraction (warm disk/max > 90%)
