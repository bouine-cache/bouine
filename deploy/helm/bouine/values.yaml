# Default values for the bouine Helm chart.

replicaCount: 3

image:
  repository: bouinecache/bouine
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# bouine config. Rendered into a ConfigMap and mounted at /etc/bouine/.
config:
  listen:
    http: ":80"
    https: ":443"
    admin: ":9000"
    cluster: ":8443"
  tls:
    certs: []
    # Provide via a Secret mounted at /etc/bouine/tls/.
    # - cert_file: /etc/bouine/tls/tls.crt
    #   key_file: /etc/bouine/tls/tls.key
  storage:
    hot_max_bytes: 2GiB
    warm_dir: /var/lib/bouine
    warm_max_bytes: 20GiB
    eviction: sieve
    warm_sync_interval: 60s  # hot→warm background sync (default); set to -1 to disable
    # warm_sync_batch_size: 5000
    # body_threshold: 64KiB
  cluster:
    enabled: true
    join: []  # populated from headless service DNS
    replicas: 2
    hop_limit: 2
  upstream_pools: []
  routes: []
  # Cloudflare Cache API invalidation propagation.
  # When zone_id and api_token are set, bouine forwards purge/ban/refresh
  # operations to the downstream Cloudflare CDN automatically.
  # cloudflare:
  #   zone_id: "abc123"           # non-secret, visible in CF dashboard URL
  #   # api_token is injected via cloudflare.apiTokenSecretName below; do
  #   # not place the token value here.
  #   propagate:
  #     purge: true
  #     ban: true
  #     refresh: true
  #   async: true                 # default; omit to keep async behaviour
  #   timeout: 10s

service:
  type: ClusterIP
  httpPort: 80
  httpsPort: 443
  adminPort: 9000

headlessService:
  # Headless service for gossip peer discovery.
  clusterPort: 8443

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 4
    memory: 8Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

podDisruptionBudget:
  enabled: true
  # minAvailable: 2 ensures at least 2 pods remain during rollout on a
  # 3-replica StatefulSet, satisfying SLO DP-5 (zero 5xx on rolling restart).
  minAvailable: 2

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule

terminationGracePeriodSeconds: 30

# Pod management policy for the StatefulSet.
# Parallel: all pods start simultaneously (correct for strong-mode
# clusters where peers join via gossip concurrently).
# maxUnavailable controls rolling update concurrency — set to 1 to
# roll one pod at a time while allowing parallel initial boot.
updateStrategy:
  maxUnavailable: 1

# Seconds after a pod becomes Ready before it enters Service endpoints.
# Gives the cluster ring time to converge after a pod joins, reducing
# the window where peer-fetch routes to a node with an incomplete ring.
minReadySeconds: 30

# preStop hook: sleep before the shutdown sequencer stops listeners,
# giving the endpoints controller time to deregister the pod.
# In strong mode, in-flight peer-fetch requests need time to drain.
preStop:
  sleepSeconds: 10

# Go runtime tuning.
# GOMEMLIMIT: leave empty (default) to auto-compute as 75% of
# resources.limits.memory via the bouine.goMemLimit helper.
# Set explicitly to override, e.g. goMemLimit: "6GiB".
# GOGC=100 (default) paired with GOMEMLIMIT keeps GC pauses bounded.
goMemLimit: ""
goGC: "100"

# Cloudflare CDN invalidation propagation.
# When zone_id and an API token are set, purge/ban/refresh operations are
# forwarded to the Cloudflare Cache API so both caches stay in sync.
#
# async: true (the default) means admin API responses return immediately while
# CF propagation runs in a background goroutine. Set to false only when you
# need synchronous confirmation (adds ~50–300 ms to every invalidation call).
#
# API token secret:
#   1. Create a Kubernetes Secret:
#        kubectl create secret generic bouine-cf-token \
#          --from-literal=CF_API_TOKEN=<your-Cache-Purge-token>
#   2. Set apiTokenSecretName below, or inject via extraEnv.
#   The operator injects CF_API_TOKEN; bouine reads it at startup as a
#   fallback when cloudflare.api_token is empty in the config file.
cloudflare:
  # apiTokenSecretName configures automatic CF_API_TOKEN injection from a
  # Kubernetes Secret.
  # apiTokenSecretName: bouine-cf-token
  # apiTokenSecretKey: "CF_API_TOKEN"  # key inside the Secret (default shown)

# Extra environment variables injected into the bouine container.
# Useful for secret references (e.g., admin token from a Secret):
#   extraEnv:
#     - name: BOUINE_ADMIN_TOKEN
#       valueFrom:
#         secretKeyRef:
#           name: bouine-admin-token
#           key: token
extraEnv: []

startupProbe:
  httpGet:
    path: /readyz
    port: admin
  periodSeconds: 10
  failureThreshold: 180  # 30 minutes max warmup
  # Budget for warm-tier WAL replay + RecomputeStats segment scan.
  # Scale with warm-tier size: ~1 min per 10 GB of segment data at
  # 10 GiB/s mmap throughput under typical container CPU limits.
  # Anti-entropy (ring digest reconciliation) is async and not on
  # the critical path — do not confuse the two.

readinessProbe:
  httpGet:
    path: /readyz
    port: admin
  periodSeconds: 5
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: admin
  periodSeconds: 10
  failureThreshold: 5

# Horizontal Pod Autoscaler. CPU-only.
# Disabled by default. Enable in per-environment values.
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 6
  cpuTrigger:
    targetType: Utilization
    averageUtilization: 70
  scaleDownStabilizationSeconds: 300

# Volume for the warm tier.
warmVolume:
  enabled: true
  size: 50Gi
  storageClass: ""

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
  labels: {}
  interval: 15s
  scrapeTimeout: ""  # uses default
