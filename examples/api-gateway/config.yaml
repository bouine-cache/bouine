# API gateway cache
#
# Short TTLs, surrogate-key invalidation (phase 5+), request collapsing.
# Suitable for: REST/GraphQL APIs behind a microservice.

listen:
  http: ":80"
  admin: ":9000"
  cluster: ":8443"

storage:
  hot_max_bytes: 512MiB

upstream_pools:
  - name: api
    targets: [api.default.svc:8080]
    health:
      active:
        path: /healthz
        interval: 5s
        timeout: 1s
        unhealthy_threshold: 3
      passive:
        consecutive_5xx: 5

routes:
  - match: { host: api.example.com, path_prefix: /v1/ }
    pool: api
    cache:
      ttl_default: 30s
      stale_while_revalidate: 10s
      stale_if_error: 5m
