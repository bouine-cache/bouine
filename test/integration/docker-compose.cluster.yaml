# docker-compose.cluster.yaml — 3-node bouine cluster for integration tests.
#
# Usage (via the Go integration driver):
#
#   docker compose \
#     -p bouine-test \
#     -f test/integration/docker-compose.cluster.yaml \
#     --env-file /tmp/bouine-test-<mode>.env \
#     up -d --build
#
# The driver sets BOUINE_CONFIG_DIR to a tmpdir containing one config file
# per node (bouine-1.yaml, bouine-2.yaml, bouine-3.yaml) generated for the
# requested cluster mode. All other env vars use the defaults listed below.
#
# Port layout (all external, relative to the host):
#   origin:   18080
#   bouine-1: HTTP=18081  admin=19001
#   bouine-2: HTTP=18082  admin=19002
#   bouine-3: HTTP=18083  admin=19003
#
# Gossip runs on an internal port (7000) visible only within bouine-net.

services:
  origin:
    build:
      context: ./origin
      dockerfile: Dockerfile
    ports:
      - "18080:8080"
    networks:
      - bouine-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15
    restart: "no"

  bouine-1:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      origin:
        condition: service_healthy
    environment:
      - POD_IP=bouine-1
    volumes:
      - "${BOUINE_CONFIG_DIR:-.}/bouine-1.yaml:/etc/bouine/config.yaml:ro"
    ports:
      - "18081:8080"
      - "19001:9000"
    networks:
      - bouine-net
    restart: "no"

  bouine-2:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      origin:
        condition: service_healthy
    environment:
      - POD_IP=bouine-2
    volumes:
      - "${BOUINE_CONFIG_DIR:-.}/bouine-2.yaml:/etc/bouine/config.yaml:ro"
    ports:
      - "18082:8080"
      - "19002:9000"
    networks:
      - bouine-net
    restart: "no"

  bouine-3:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      origin:
        condition: service_healthy
    environment:
      - POD_IP=bouine-3
    volumes:
      - "${BOUINE_CONFIG_DIR:-.}/bouine-3.yaml:/etc/bouine/config.yaml:ro"
    ports:
      - "18083:8080"
      - "19003:9000"
    networks:
      - bouine-net
    restart: "no"

networks:
  bouine-net:
    driver: bridge
