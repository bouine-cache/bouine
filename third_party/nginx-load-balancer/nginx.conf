pid /tmp/nginx.pid;

events {
  multi_accept         on;
  worker_connections   1000;
  use                  epoll;
}

http {
  upstream bouine {
    server bouine1:8080;
    server bouine2:8080;
    server bouine3:8080;
  }

  server {
    listen 4000;
    location / {
      proxy_pass http://bouine;
    }
  }
}
